syntax = "proto3";

option optimize_for = LITE_RUNTIME;

package tl.pro;

import "item.proto";


enum max_value_type {
  life = 0;
  mana = 1;
}

message REQplayer_max_value {
  bool is_open = 1;
  max_value_type type = 2;
  int32 max = 3;
  int32 value = 4;
}

message REQplayer_get_bag {
  optional int32 player_index = 1;
  bool me = 2;
}

message RESplayer_get_bag {
  repeated item items = 1;
}